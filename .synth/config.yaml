# SYNTH project configuration
# Derived from expedition ee4874cdcadaf218: enforce the expedition branch
# workflow at start by auto-creating and staying on canonical expedition
# branches (ECOSYSTEM-001).
#
# Bootstrap window closed (2026-10-12): `mode: enforce` is restored together
# with ADR-056 (`--branch` / `--no-create`). Operator-owned workspaces declare
# their branch explicitly; declaredPatterns keeps the arena branch warning-free.
# See docs/plans/master-delivery-plan.md.
git:
  # Single-writer ledger branch for this session's ceremonies (ADR-055 §2.9).
  # NOTE: this key is a session-scoped value in tracked config, and it goes
  # stale the moment the session ends — the previous value named a branch that
  # was deleted on merge, and `.synth/data/ledger.json` still records an even
  # older one (arena/c5db653e-synth). With both stale, resolution falls back to
  # `main`, which would commit governance state onto the trunk branch instead
  # of this checkout. Naming the checkout explicitly is the current workaround;
  # removing the key entirely (infer the ledger branch from the checkout when it
  # matches branchPolicy.declaredPatterns) is the fix, drafted as expedition
  # "Adapter configuration consolidated".
  ledgerBranch: arena/d5e4625c-synth
  branchStrategy: featured
  branchPolicy:
    mode: enforce
    declaredPatterns: ["arena/*"]
