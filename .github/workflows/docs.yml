# ============================================================
# Synth Documentation Generation — GitHub Actions Adapter
# ============================================================
# Regenerates derived documentation projections on every push to
# main and every pull request, validates them, and publishes the
# generated files as a build artifact. The projections themselves
# are not committed to version control (see EXP-GUARD-002).
# ============================================================

name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: docs-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    if: >-
      ${{
        !contains(github.event.head_commit.message, '[skip ci]') &&
        github.event.head_commit.author.name != 'github-actions[bot]'
      }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Generate documentation projections
        run: node dist/cli/synth.js task run docs:generate

      - name: Validate projections
        run: node dist/cli/synth.js task run docs:validate-projections

      - name: Check internal links
        run: node dist/cli/synth.js task run docs:check-links

      - name: Upload generated documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: synth-docs-${{ github.run_id }}
          path: docs/generated/
          if-no-files-found: error

      - name: Record artifact summary
        run: |
          {
            echo "## Generated Documentation ✅"
            echo ""
            echo "- **Artifact:** synth-docs-${{ github.run_id }}"
            echo "- **Path:** docs/generated/"
            echo "- **Note:** Projections are generated on demand and are not tracked in version control."
          } >> "${GITHUB_STEP_SUMMARY}"
